name: Daily Profile Refresh

# Runs every morning in GitHub's cloud — independent of your machine being
# online. Regenerates the profile assets and pushes them in a SINGLE commit.
# You can also trigger it manually from the Actions tab (Run workflow).
on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC = 07:00 IST, every morning
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3D contribution graph → profile-3d-contrib/*.svg
      # NOTE: this action reads the username from the USERNAME *env var*, not a
      # `with:` input. Passing it as `with: username:` (the old config) left it
      # empty and failed with "USERNAME is empty" every day.
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # Profile summary cards → profile-summary-card-output/**
      # AUTO_PUSH:false so it only generates; we commit everything once below.
      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          AUTO_PUSH: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Single commit for the whole refresh ──
      # [skip ci] keeps Vercel from redeploying the site for asset-only commits.
      - name: Commit & push (one commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No profile changes today — nothing to commit."
            exit 0
          fi
          git commit -m "chore: daily profile refresh [skip ci]"
          git pull --rebase --autostash origin main
          git push
