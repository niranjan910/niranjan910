<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EGN Connect X — live project">
  <title>EGN Connect X</title>
  <defs>
    <filter id="shadow-egnx-dark" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-egnx-dark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <clipPath id="cardClip-egnx-dark">
      <rect x="1" y="1" width="398" height="198" rx="18"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow-egnx-dark)">
    <rect x="1" y="1" width="398" height="198" rx="18" fill="#0A0A0A" stroke="#242424" stroke-width="1"/>
  </g>

  <g clip-path="url(#cardClip-egnx-dark)">
    <circle cx="360" cy="10" r="90" fill="#A3E635" opacity="0.08" filter="url(#glow-egnx-dark)">
      <animate attributeName="opacity" values="0.05;0.11;0.05" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(44,52)" opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" begin="0.30s" dur="0.3s" fill="freeze"/>
      <circle r="16" fill="#A3E635" opacity="0.12"/>
      <g>
        <circle cx="-6" cy="-5" r="2" fill="none" stroke="#A3E635" stroke-width="1.4"/>
        <circle cx="6" cy="-5" r="2" fill="none" stroke="#A3E635" stroke-width="1.4"/>
        <circle cx="0" cy="6" r="2" fill="none" stroke="#A3E635" stroke-width="1.4"/>
        <line x1="-4.5" y1="-3.5" x2="-1.5" y2="4.5" stroke="#A3E635" stroke-width="1.2"/>
        <line x1="4.5" y1="-3.5" x2="1.5" y2="4.5" stroke="#A3E635" stroke-width="1.2"/>
        <line x1="-4" y1="-5" x2="4" y2="-5" stroke="#A3E635" stroke-width="1.2"/>
        <animateTransform attributeName="transform" type="scale" values="0;1.18;1" keyTimes="0;0.65;1" begin="0.30s" dur="0.45s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.06;1" keyTimes="0;0.5;1" begin="0.75s" dur="2.8s" repeatCount="indefinite"/>
      </g>
    </g>

    <text x="72" y="58" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#EDEDED" opacity="0">EGN Connect X
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" begin="0.55s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="72" y="78" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" letter-spacing="0.3" fill="#8A8A8A" opacity="0">egnconnectx.com
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" begin="0.65s" dur="0.3s" fill="freeze"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" begin="0.80s" dur="0.3s" fill="freeze"/>
      <rect x="32" y="138" width="150" height="36" rx="18" fill="none" stroke="#A3E635" stroke-width="1.4"/>
      <text x="107" y="161" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#A3E635">Visit Site<tspan dx="4">↗</tspan></text>
    </g>
  </g>
</svg>
