<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StudyNLearn — live project">
  <title>StudyNLearn</title>
  <defs>
    <filter id="shadow-snl-light" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0A0A0A" flood-opacity="0.12"/>
    </filter>
    <filter id="glow-snl-light" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <clipPath id="cardClip-snl-light">
      <rect x="1" y="1" width="398" height="198" rx="18"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow-snl-light)">
    <rect x="1" y="1" width="398" height="198" rx="18" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1"/>
  </g>

  <g clip-path="url(#cardClip-snl-light)">
    <circle cx="360" cy="10" r="90" fill="#4D7C0F" opacity="0.08" filter="url(#glow-snl-light)">
      <animate attributeName="opacity" values="0.05;0.11;0.05" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(44,52)" opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" begin="0.50s" dur="0.3s" fill="freeze"/>
      <circle r="16" fill="#4D7C0F" opacity="0.12"/>
      <g>
        <path d="M0,-5 C-3,-7 -7,-7 -7,-5 L-7,5 C-7,3 -3,3 0,5 Z" fill="none" stroke="#4D7C0F" stroke-width="1.3"/>
        <path d="M0,-5 C3,-7 7,-7 7,-5 L7,5 C7,3 3,3 0,5 Z" fill="none" stroke="#4D7C0F" stroke-width="1.3"/>
        <animateTransform attributeName="transform" type="scale" values="0;1.18;1" keyTimes="0;0.65;1" begin="0.50s" dur="0.45s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.06;1" keyTimes="0;0.5;1" begin="0.95s" dur="2.8s" repeatCount="indefinite"/>
      </g>
    </g>

    <text x="72" y="58" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#14171A" opacity="0">StudyNLearn
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" begin="0.75s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="72" y="78" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" letter-spacing="0.3" fill="#6B7280" opacity="0">studynlearn.com
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" begin="0.85s" dur="0.3s" fill="freeze"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" begin="1.00s" dur="0.3s" fill="freeze"/>
      <rect x="32" y="138" width="150" height="36" rx="18" fill="none" stroke="#4D7C0F" stroke-width="1.4"/>
      <text x="107" y="161" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#4D7C0F">Visit Site<tspan dx="4">↗</tspan></text>
    </g>
  </g>
</svg>
